<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>AI 위험 보고서 Demo</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    label { display: block; font-size: 13px; color: #555; margin-top: 8px; }
    input, textarea { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 12px; margin-right: 8px; }
    button.secondary { background: #6b7280; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .b-imm { background: #dc2626; color: white; }
    .b-high { background: #f97316; color: white; }
    .b-med { background: #eab308; color: white; }
    .b-low { background: #10b981; color: white; }
    .reasons li, .actions li { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>AI 위험 보고서 Demo (LLM Report Module)</h1>
  <p>API 서버: <code id="api-base">http://localhost:8000</code></p>

  <section>
    <h2>입력</h2>
    <label>CVE ID</label>
    <input id="cve_id" value="CVE-2021-44228" />
    <label>Domain / IP</label>
    <input id="domain" value="localhost" />
    <label>Port</label>
    <input id="port" type="number" value="8080" />
    <label>Service</label>
    <input id="service_name" value="http" />
    <label>Technology stack (콤마 구분)</label>
    <input id="technology_stack" value="apache:log4j-core:2.14.1" />
    <label>CVSS</label>
    <input id="cvss_score" type="number" step="0.1" value="10.0" />
    <label>EPSS percentile</label>
    <input id="epss_percentile" type="number" step="0.01" value="0.99" />
    <label>KEV status (true/false)</label>
    <input id="kev_status" value="true" />
    <label>CWE IDs (콤마 구분)</label>
    <input id="cwe_id" value="CWE-502, CWE-917" />
    <label>출력 언어</label>
    <input id="language" value="ko" />

    <button onclick="generate()">🤖 AI 보고서 생성</button>
    <button class="secondary" onclick="copyReport()">📋 보고서 텍스트 복사</button>
  </section>

  <section>
    <h2>AI 위험 원인 요약 (risk_summary)</h2>
    <div id="summary">-</div>
  </section>

  <section>
    <h2>AI 대응 방안 제안</h2>
    <strong>위험 원인</strong>
    <ul class="reasons" id="reasons"></ul>
    <strong>대응 방안</strong>
    <ul class="actions" id="actions"></ul>
    <p>우선순위: <span id="priority" class="badge">-</span></p>
  </section>

  <section>
    <h2>전체 보고서 (Markdown)</h2>
    <pre id="report_text">아직 생성되지 않았습니다.</pre>
  </section>

  <section>
    <h2>Raw JSON 응답</h2>
    <pre id="raw">-</pre>
  </section>

  <script>
    const BASE = document.getElementById('api-base').textContent;
    let lastReportText = "";

    async function generate() {
      const body = {
        cve_id: val('cve_id'),
        domain: val('domain'),
        ip: val('domain'),
        port: parseInt(val('port'), 10),
        service_name: val('service_name'),
        technology_stack: val('technology_stack').split(',').map(s => s.trim()).filter(Boolean),
        cvss_score: parseFloat(val('cvss_score')),
        epss_percentile: parseFloat(val('epss_percentile')),
        kev_status: val('kev_status').toLowerCase() === 'true',
        cwe_id: val('cwe_id').split(',').map(s => s.trim()).filter(Boolean),
        language: val('language'),
      };

      document.getElementById('summary').textContent = '생성 중...';
      try {
        const res = await fetch(`${BASE}/api/llm/report/vulnerability`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('summary').textContent = '❌ 호출 실패: ' + e.message;
      }
    }

    function render(data) {
      document.getElementById('summary').textContent = data.risk_summary || '-';
      document.getElementById('reasons').innerHTML = (data.risk_reasons || []).map(r => `<li>${esc(r)}</li>`).join('');
      document.getElementById('actions').innerHTML = (data.recommended_actions || []).map(r => `<li>${esc(r)}</li>`).join('');
      const p = data.priority || 'Medium';
      const badge = document.getElementById('priority');
      badge.textContent = p;
      badge.className = 'badge ' + ({Immediate:'b-imm', High:'b-high', Medium:'b-med', Low:'b-low'}[p] || 'b-med');
      lastReportText = data.report_text || '';
      document.getElementById('report_text').textContent = lastReportText;
      document.getElementById('raw').textContent = JSON.stringify(data, null, 2);
    }

    function copyReport() {
      if (!lastReportText) { alert('먼저 보고서를 생성하세요.'); return; }
      navigator.clipboard.writeText(lastReportText).then(() => alert('복사되었습니다.'));
    }

    function val(id) { return document.getElementById(id).value; }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  </script>
</body>
</html>
